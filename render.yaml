services:
  - type: web
    name: truxera-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: truxera
      - key: SECRET_KEY
        sync: false
      - key: WHOIS_API_KEY
        sync: false
      - key: GOOGLE_SAFE_BROWSING_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
